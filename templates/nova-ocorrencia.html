<body style="background-color: #000025;">
    <h1 style="color: #ffffff;">Nova ocorrência</h1>

    <form action="/nova-ocorrencia" method="POST" enctype="multipart/form-data">
        <input type="hidden" id="latitude" name="latitude">
        <input type="hidden" id="longitude" name="longitude">
        <label for="tipo">Tipo de ocorrência:</label>
        <select id="tipo" name="tipo">
            <option value="rachadura">Rachadura</option>
            <option value="alagamento">Alagamento</option>
            <option value="erosao">Erosão</option>
            <option value="deslizamento">Deslizamento</option>
            <option value="vegetacao">Falta de vegetação</option>
        </select>
        <br><br>

        <label for="descricao">Descrição:</label>
        <br>
        <textarea id="descricao" name="descricao"
                  placeholder="Descreva o que você observou"></textarea>

        <br><br>

        <label for="foto">Foto:</label>
        <input type="file" id="foto" name="foto" accept="image/*">
        
        <p style="color: #ffffff;" id="status-localizacao">Obtendo localização...</p>
        <br><br>

<button type="submit">Registrar ocorrência</button>
    </form>
    <script>

        if (navigator.geolocation) {

            navigator.geolocation.getCurrentPosition(
                function(posicao) {

                    const latitude = posicao.coords.latitude;
                    const longitude = posicao.coords.longitude;

                    document.getElementById("latitude").value = latitude;
                    document.getElementById("longitude").value = longitude;

                    document.getElementById("status-localizacao").textContent =
                        "📍 Localização obtida!";

                },

                function(erro) {

                    document.getElementById("status-localizacao").textContent =
                        "⚠️ Não foi possível obter a localização.";

                }
            );

        } else {

            document.getElementById("status-localizacao").textContent =
                "⚠️ Este navegador não suporta localização.";

        }
    
    </script>
    <script>
        function validarCampos(event) {
            const foto = document.getElementById('fotoInput');
            const descricao = document.getElementById('descricaoInput');

            // Verifica se a descrição está vazia (ignorando espaços em branco) ou se nenhum arquivo foi selecionado
            if (descricao.value.trim() === "" || foto.files.length === 0) {
                // Impede o envio do formulário
                event.preventDefault(); 

                // Exibe o aviso
                alert("⚠️ Por favor, preencha a descrição e selecione uma foto antes de registrar!");
                return false;
            }

            // Se estiver tudo preenchido, o formulário é enviado normalmente
            return true;
        }
    </script>
</body>
