<!DOCTYPE html>
<html lang="pt-br">

<head>

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];

        OneSignalDeferred.push(async function(OneSignal) {

            await OneSignal.init({
                appId: "a9a2b318-5ea1-49c3-8d97-2b8226dd4839",
            });

        });
    </script>

    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="BioGlow Watch"
    >

    <link
        rel="apple-touch-icon"
        href="{{ url_for('static', filename='logotipo.png') }}"
    >

    <meta
        name="theme-color"
        content="#000025"
    >

    <meta
        charset="UTF-8"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>Início - BioGlow Watch</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        body {

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 0;

            background-color: #000010;

        }


        /* =====================================================
           MAPA
        ===================================================== */

        #mapa {

            height: 400px;

            width: 92.5%;

            margin: 20px auto;

            border-radius: 10px;

            z-index: 10;

            bottom: 40px;

        }


        /* =====================================================
           LEGENDA DO MAPA
        ===================================================== */

        .legenda-risco {

            width: 92.5%;

            margin: -25px auto 20px auto;

            padding: 12px;

            box-sizing: border-box;

            background-color: #222;

            color: white;

            border-radius: 8px;

            border: 1px solid #444;

            box-shadow:
                0px 4px 10px rgba(0, 0, 0, 0.3);

        }


        .legenda-titulo {

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        .legenda-item {

            display: flex;

            align-items: center;

            margin: 6px 0;

            font-size: 14px;

        }


        .bolinha-risco {

            width: 14px;

            height: 14px;

            border-radius: 50%;

            display: inline-block;

            margin-right: 8px;

        }


        .bolinha-verde {

            background-color: #28a745;

        }


        .bolinha-amarela {

            background-color: #ffc107;

        }


        .bolinha-laranja {

            background-color: #ff8c00;

        }


        .bolinha-vermelha {

            background-color: #dc3545;

        }


        /* =====================================================
           CARTÃO SUPERIOR - TIPO DE RISCO
        ===================================================== */

        .cartao-detalhe-risco {

            border-radius: 8px;

            background-color: #222;

            color: #fff;

            text-align: center;

            width: 125px;

            height: 90px;

            position: fixed;

            bottom: 120px;

            left: 25px;

            z-index: 1000;

            box-shadow:
                0px 4px 10px rgba(0, 0, 0, 0.4);

            border: 1px solid #444;

        }


        .cartao-detalhe-risco p {

            margin: 0;

            font-size: 20px;

        }


        /* =====================================================
           CARTÃO CLIMA
        ===================================================== */

        .cartao-clima {

            border-radius: 8px;

            background-color: #1e293b;

            color: #fff;

            text-align: center;

            width: 125px;

            position: fixed;

            bottom: 120px;

            right: 25px;

            height: 90px;

            z-index: 1000;

            box-shadow:
                0px 4px 10px rgba(0, 0, 0, 0.4);

            border: 1px solid #334155;

        }


        .cartao-clima p {

            margin: 0;

            font-size: 11px;

        }


        /* =====================================================
           CARTÃO STATUS
        ===================================================== */

        .cartao-status {

            padding: 10px 14px;

            border-radius: 8px;

            background-color: #222;

            color: white;

            text-align: center;

            width: 100px;

            height: 70px;

            position: fixed;

            bottom: 15px;

            left: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 1000;

            box-shadow:
                0px 4px 10px rgba(0, 0, 0, 0.3);

            border: 1px solid #444;

        }


        .cartao-status h3 {

            margin: 0;

            font-size: 14px;

        }


        /* =====================================================
           CORES DO STATUS
        ===================================================== */

        .icone-risco {

            font-size: 24px;

            margin-right: 6px;

        }


        .icone-seguro {

            color: #28a745 !important;

        }


        .icone-atencao {

            color: #ffc107 !important;

        }


        .icone-alerta {

            color: #ff8c00 !important;

        }


        .icone-emergencia {

            color: #dc3545 !important;

        }


        /* =====================================================
           BOTÃO OCORRÊNCIA
        ===================================================== */

        .btn-ocorrencia {

            width: 125px;

            height: 90px;

            position: fixed;

            bottom: 15px;

            right: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 1000;

            background-color: #000045;

            color: white;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0px 4px 10px rgba(0, 0, 0, 0.3);

            border: 1px solid #334;

        }


        /* =====================================================
           RETÂNGULOS
        ===================================================== */

        .retanguloabaixo {

            height: 220px;

            width: 100%;

            right: 10px;

            bottom: 5px;

            background-color: #000025;

            position: fixed;

            border-radius: 8px;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 100;

        }


        .retanguloacima {

            height: 220px;

            width: 100%;

            right: 0px;

            bottom: 450px;

            background-color: #000025;

            position: fixed;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: -1;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         LOGO
    ===================================================== -->

    <h1 style="text-align: center;">

        <img
            src="{{ url_for('static', filename='logotipo2.png') }}"
            style="height: 75px; position: relative; top: -25px;"
        >

    </h1>


    <!-- =====================================================
         MAPA
    ===================================================== -->

    <div id="mapa"></div>


    <!-- =====================================================
         LEGENDA
    ===================================================== -->

    <div class="legenda-risco">

        <div class="legenda-titulo">
            Legenda de risco
        </div>

        <div class="legenda-item">

            <span
                class="bolinha-risco bolinha-verde"
            ></span>

            Pouco risco
        </div>

        <div class="legenda-item">

            <span
                class="bolinha-risco bolinha-amarela"
            ></span>

            Atenção
        </div>

        <div class="legenda-item">

            <span
                class="bolinha-risco bolinha-laranja"
            ></span>

            Alerta
        </div>

        <div class="legenda-item">

            <span
                class="bolinha-risco bolinha-vermelha"
            ></span>

            Emergência
        </div>

    </div>


    <!-- =====================================================
         CARTÃO TIPO DE RISCO
    ===================================================== -->

    <div class="cartao-detalhe-risco">

        <h5>
            {{ tipo_risco_texto | safe }}
        </h5>

    </div>


    <!-- =====================================================
         CARTÃO CLIMA
    ===================================================== -->

    <div class="cartao-clima">

        <h5>
            {{ clima_atual | safe }}
        </h5>

    </div>


    <!-- =====================================================
         CARTÃO STATUS
    ===================================================== -->

    <div class="cartao-status">

        <h3>

            <span
                class="icone-risco icone-{{ cor_classe }}"
            >
                ⚠
            </span>

            <br>

            {{ status }}

        </h3>

    </div>


    <div class="retanguloabaixo"></div>

    <div class="retanguloacima"></div>


    <!-- =====================================================
         NOVA OCORRÊNCIA
    ===================================================== -->

    <a href="/nova-ocorrencia">

        <button class="btn-ocorrencia">

            <h1>📷</h1>

        </button>

    </a>


    <!-- =====================================================
         LEAFLET
    ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <script>

        let jaNotificou = false;


        // ===================================================
        // NOTIFICAÇÕES
        // ===================================================

        function enviarNotificacaoAutomatica() {

            const statusAtual =
                "{{ status }}";


            if (
                statusAtual === "Emergência"
                &&
                !jaNotificou
            ) {

                jaNotificou = true;


                const titulo =
                    "🚨 ALERTA DE EMERGÊNCIA - BioGlow";


                const opcoes = {

                    body:
                        "Atenção: A sua região atingiu o nível crítico de risco!",

                    icon:
                        "{{ url_for('static', filename='logotipo.png') }}"

                };


                try {

                    if (
                        'serviceWorker' in navigator
                        &&
                        navigator.serviceWorker.controller
                    ) {

                        navigator.serviceWorker.ready.then(
                            registration => {

                                registration.showNotification(
                                    titulo,
                                    opcoes
                                );

                            }
                        );

                    } else {

                        new Notification(
                            titulo,
                            opcoes
                        );

                    }

                } catch (e) {

                    console.error(
                        "Erro no envio da notificação:",
                        e
                    );

                }

            }

        }


        function verificarEAtivarNotificacao() {

            if ("Notification" in window) {

                if (
                    Notification.permission === "granted"
                ) {

                    enviarNotificacaoAutomatica();

                }

                else if (
                    Notification.permission === "default"
                ) {

                    Notification.requestPermission().then(
                        permission => {

                            if (
                                permission === "granted"
                            ) {

                                enviarNotificacaoAutomatica();

                            }

                        }
                    );

                }

            }

        }


        verificarEAtivarNotificacao();


        document.addEventListener(
            "visibilitychange",
            () => {

                if (
                    document.visibilityState === "visible"
                ) {

                    verificarEAtivarNotificacao();

                }

            }
        );


        // ===================================================
        // MAPA
        // ===================================================

        const mapa = L.map(
            "mapa"
        ).setView(
            [-22.28, -42.53],
            13
        );


        // Imagem de satélite Esri

        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                attribution:
                    "Tiles &copy; Esri"
            }
        ).addTo(mapa);


        // ===================================================
        // ÍCONES DOS PINS
        // ===================================================

        const sombraPin =
            "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png";


        function criarIcone(cor) {

            return L.icon({

                iconUrl:
                    `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${cor}.png`,

                shadowUrl:
                    sombraPin,

                iconSize:
                    [25, 41],

                iconAnchor:
                    [12, 41],

                popupAnchor:
                    [1, -34],

                shadowSize:
                    [41, 41]

            });

        }


        const iconeVerde =
            criarIcone("green");


        const iconeAmarelo =
            criarIcone("yellow");


        const iconeLaranja =
            criarIcone("orange");


        const iconeVermelho =
            criarIcone("red");


        // ===================================================
        // ESCOLHER COR PELO RISCO
        // ===================================================

        function escolherIcone(risco) {

            risco = Number(risco) || 0;


            if (risco < 25) {

                return iconeVerde;

            }

            else if (risco < 50) {

                return iconeAmarelo;

            }

            else if (risco < 70) {

                return iconeLaranja;

            }

            else {

                return iconeVermelho;

            }

        }


        // ===================================================
        // MARCADORES DO BANCO
        // ===================================================

        {% for ocorrencia in ocorrencias %}

            {% if ocorrencia[4] is not none and ocorrencia[5] is not none %}

                L.marker(

                    [
                        {{ ocorrencia[4] }},
                        {{ ocorrencia[5] }}
                    ],

                    {
                        icon: escolherIcone(
                            {{ ocorrencia[6] if ocorrencia[6] is not none else 0 }}
                        )
                    }

                )

                .addTo(mapa)

                .bindPopup(

                    "<div style='text-align: center; max-width: 200px;'>" +

                        "<strong>📍 {{ ocorrencia[1] | capitalize }}</strong><br><br>" +

                        "{% if ocorrencia[3] %}" +

                            "<img " +

                            "src='/uploads/{{ ocorrencia[3] }}' " +

                            "style='width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 8px;'>" +

                            "<br>" +

                        "{% endif %}" +

                        "<strong>Risco:</strong> " +

                        "{{ ocorrencia[6] if ocorrencia[6] is not none else 0 }} / 100" +

                        "<br><br>" +

                        "<strong>Descrição:</strong><br>" +

                        "{{ ocorrencia[2] }}" +

                        "<br><br>" +

                        "<small style='color: #666;'>" +

                            "Lat: {{ ocorrencia[4] }} | Long: {{ ocorrencia[5] }}" +

                        "</small>" +

                    "</div>"

                );

            {% endif %}

        {% endfor %}

    </script>


    <!-- =====================================================
         SERVICE WORKER
    ===================================================== -->

    <script>

        if ('serviceWorker' in navigator) {

            window.addEventListener(
                'load',
                function() {

                    navigator.serviceWorker.register(
                        "{{ url_for('static', filename='sw.js') }}"
                    )

                    .then(
                        function(reg) {

                            console.log(
                                'Service Worker registrado com sucesso:',
                                reg.scope
                            );

                        }
                    )

                    .catch(
                        function(err) {

                            console.log(
                                'Erro ao registrar Service Worker:',
                                err
                            );

                        }
                    );

                }
            );

        }

    </script>


</body>

</html>
